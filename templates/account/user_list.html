{% extends "common/base.html" %}
{% load thumbnail %}

{% block title %}people{% endblock title %}

{% block content %}
<h1>people</h1>
<div id="people-list">
    {% for user in users %}
    <div class="user">
        <a href="{{ user.get_absolute_url }}">
            <img src="{% thumbnail user.profile.photo 180x180%}" alt="no photo">
        </a>
        <div class="info">
            <a href="{{ user.get_absolute_url }}" class="title">
                {{ user.get_full_name }}
            </a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock content %}
